# ============================================================
#  1D SR MHD — Balsara Test 2
#              (Giacomazzo & Rezzolla, Table 4)
#
#  Gamma = 5/3
#  High left pressure (30:1 ratio) with strong transverse
#  B-fields on both sides. Tests fast magnetosonic shocks.
#
#  Left:  (rho, p, vx, vy, vz, Bx, By, Bz) = (1, 30, 0, 0, 0, 5, 6,  6)
#  Right: (rho, p, vx, vy, vz, Bx, By, Bz) = (1,  1, 0, 0, 0, 5, 0.7, 0.7)
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.4
  atmo_rho: 1.0e-10
  solver:   hllc
  device:   cpu

  primL:
    rho: 1.0
    p:   30.0
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  5.0
    By:  6.0
    Bz:  6.0
  primR:
    rho: 1.0
    p:   1.0
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  5.0
    By:  0.7
    Bz:  0.7
  x_interface: 0.5

output:
  dir:           output_balsara2
  every_n_steps: 1000