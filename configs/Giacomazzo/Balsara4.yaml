# ============================================================
#  1D SR MHD — Balsara Test 4
#              (Giacomazzo & Rezzolla, Table 4)
#
#  Gamma = 5/3
#  Highly relativistic counter-streaming: vx = ±0.999.
#  Equal pressure and density on both sides; By and Bz reverse.
#  Lorentz factor W ~ 22.4. The most relativistic of the
#  Balsara suite — tests SR effects at their most extreme.
#
#  Left:  (rho, p,   vx,    vy, vz, Bx,  By,  Bz ) = (1, 0.1,  0.999, 0, 0, 10,  7,  7)
#  Right: (rho, p,   vx,    vy, vz, Bx,  By,  Bz ) = (1, 0.1, -0.999, 0, 0, 10, -7, -7)
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.2         # reduced CFL — highly relativistic speeds
  atmo_rho: 1.0e-10
  solver:   hllc
  device:   cpu

  primL:
    rho: 1.0
    p:   0.1
    vx:  0.999
    vy:  0.0
    vz:  0.0
    Bx:  10.0
    By:  7.0
    Bz:  7.0
  primR:
    rho: 1.0
    p:   0.1
    vx:  -0.999
    vy:  0.0
    vz:  0.0
    Bx:  10.0
    By:  -7.0
    Bz:  -7.0
  x_interface: 0.5

output:
  dir:           output_balsara4
  every_n_steps: 1000