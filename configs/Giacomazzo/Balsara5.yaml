# ============================================================
#  1D SR MHD — Balsara Test 5
#              (Giacomazzo & Rezzolla, Table 4)
#
#  Gamma = 5/3
#  Fully generic asymmetric state: all primitive variables
#  differ across the interface, including vy, vz, By, Bz.
#  This is the most comprehensive single-wave test in the
#  Balsara suite — no special symmetry to hide solver flaws.
#
#  Left:  (rho, p,    vx,   vy,   vz,  Bx, By,   Bz ) = (1.08, 0.95,  0.40,  0.3,  0.2, 2, 0.3,  0.3)
#  Right: (rho, p,    vx,   vy,   vz,  Bx, By,   Bz ) = (1.00, 1.00, -0.45, -0.2,  0.2, 2,-0.7,  0.5)
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.4
  atmo_rho: 1.0e-10
  solver:   hllc
  device:   cpu

  primL:
    rho: 1.08
    p:   0.95
    vx:  0.40
    vy:  0.3
    vz:  0.2
    Bx:  2.0
    By:  0.3
    Bz:  0.3
  primR:
    rho: 1.00
    p:   1.00
    vx:  -0.45
    vy:  -0.2
    vz:  0.2
    Bx:  2.0
    By:  -0.7
    Bz:  0.5
  x_interface: 0.5

output:
  dir:           output_balsara5
  every_n_steps: 1000