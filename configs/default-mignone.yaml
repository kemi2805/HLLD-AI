# ============================================================
#  HLLD ML — Mignone et al. (2022) 1D shock-tube regime
#
#  Ranges are derived from the six 1D test problems in Table 1:
#    CW  : isolated contact wave
#    RW  : isolated rotational wave
#    ST1 : co-planar Balsara shock tube
#    ST2 : non-planar shock tube (Alfven rotation)
#    ST3 : colliding relativistic streams (v = ±0.999)
#    ST4 : generic Alfven test (Giacomazzo & Rezzolla 2006)
#
#  rho  : 0.125 .. 10.0   → log10 range [-0.9, 1.0]
#  p    : 0.1   ..  5.3   → temp range covers this via EOS
#  vx   : -0.999 .. 0.999 → W up to ~22 (ST3)
#  Bx   : 0.5   .. 10.0
#  Bt   : 0.0   ..  ~9.9  (ST4: By=6, Bz=2 → |Bt|=6.32; CW: |Bt|=1.12)
# ============================================================

data:
  n_samples:  10000000
  batch_size: 1000000
  n_angles: 1
  
  seed: 43
  raw_path: data/raw/dataset_mignone_rankine.npz
  split_dir: data/splits_mignone_rankine
  norm_method: standard    # standard | minmax | log

  ranges:
    # log10(rho): covers 0.125 (ST1-R) to 10.0 (CW-L)
    lrho:   [-1.0, 1.0]

    # Lorentz factor: W=1 (rest) up to ~22 for v=0.999 (ST3)
    # Use W=1..25 to fully cover the ST3 colliding-stream regime
    W:      [1.0, 2.0] #[1.0, 25.0]

    # log10(press): covers 0.1 to 1000
    press:   [0.1, 1.0]

    # Bx shared between L and R (divergence-free); covers 0.5..10.0
    Bx:     [0.01, 1.01] #[0.5, 10.0]

    # Transverse B magnitude sqrt(By^2+Bz^2):
    # ST1: |Bt|=1.0, ST2: up to ~0.76, ST3: |Bt|=9.90, ST4: |Bt|=6.32
    # Allow 0 (ST1-L has Bz=0) up to 10.0
    Bt_mag: [0.0, 1.0] #[0.0, 10.0]

  bias_strength: 1

# EOS: ideal gas with Gamma=5/3, matching all Mignone Table 1 tests
# (ST1 uses Gamma=2, but 5/3 covers the majority; adjust if targeting ST1 only)
eos:
  K: 0
  gamma: 1.66666667        # 5/3 — adiabatic index for most tests
  gamma_th: 1.66666667     # same for thermal component

model:
  n_input: 15
  dropout: 0.00
  #hidden: [256, 256, 256, 128, 64]
  #activation: tanh
  hidden: [256, 256, 256, 256, 128, 64]
  activation: silu  # or gelu — smoother gradient than tanh for regression

training:
  epochs: 300
  batch_size: 4096
  weight_decay: 1.0e-4
  lambda_phys: 0.0
  lr_patience: 10
  lr: 3.0e-3
  lr_min: 1.0e-7
  lr_max: 5.0e-3
  lr_step_size_up: 7
  lr_step_size_down: 15
  T_max: 300
  eta_min: 1.0e-6


  device: mps       # mps (Apple Silicon) | cuda | cpu
