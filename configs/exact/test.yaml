# ============================================================
#  1D SR-MHD — Shock Tube 1 (ST1)
#  Mattia & Mignone 2021 (arXiv:2111.09369), Table 1, row "ST1"
#
#  Co-planar vectors on either side — no rotational wave forms.
#  EOS: gamma=2.0 (stiff). Contains fast rarefaction, compound
#  wave, contact, slow shock, and fast shock.
# ============================================================
grid:
  xmin: 0.0
  xmax: 1.0
  ncells: 400
  ng: 2

eos:
  K: 0.0
  gamma: 1.3333
  gamma_th: 1.3333

run:
  problem: generic
  t_end: 0.4
  cfl: 0.8
  atmo_rho: 1.0e-10
  solver: hlld
  device: cpu

  # Initial left/right states (Mattia & Mignone 2021, Table 1, ST1)
  primL:
    rho: 50.0
    p: 0.05
    vx: -0.3
    vy: 0.4
    vz: 0.0
    Bx: 1.0
    By: 10.0
    Bz: 0.0
  primR:
    rho: 1.0
    p: 0.05
    vx: -0.3
    vy: -0.4
    vz: 0.0
    Bx: 1.0
    By: -10.0
    Bz: 0.0
  x_interface: 0.5

output:
  dir: test_exact
  every_n_steps: 100
  dt_snapshot: 1000.0
