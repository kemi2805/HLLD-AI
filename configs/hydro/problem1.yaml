# ============================================================
#  1D SR hydro — Problem 1 (Mignone & Bodo 2005, §4.2)
#
#  Riemann problem producing two shock waves separated by a
#  contact discontinuity.
#
#  Initial data (eq. 32):
#    Left:  (rho, vx, p) = (1, 0.9, 1)
#    Right: (rho, vx, p) = (1, 0,  10)
#
#  EOS: ideal gas, Gamma = 4/3
#  CFL = 0.8, t_end = 0.4
#
#  Expected result:
#    - Two outward-propagating shock waves
#    - Contact discontinuity between them
#    - HLLC resolves contact sharply; HLL smears it
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 100
  ng:     2

eos:
  K:        0.0
  gamma:    1.3333333   # 4/3
  gamma_th: 1.3333333

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.8
  atmo_rho: 1.0e-10
  solver:   hllc          # swap to hll to compare diffusivity on contact
  device:   cpu

  primL:
    rho: 1.0
    p:   1.0
    vx:  0.9
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  primR:
    rho: 1.0
    p:   10.0
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  x_interface: 0.5

output:
  dir:           output_problem1
  every_n_steps: 1000