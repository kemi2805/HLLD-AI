# ============================================================
#  1D SR hydro — Problem 2 (Mignone & Bodo 2005, §4.3)
#
#  Riemann problem producing left- and right-going rarefaction
#  waves with a contact discontinuity in the middle.
#
#  Initial data (eq. 33):
#    Left:  (rho, vx, p) = (1,  -0.6, 10)
#    Right: (rho, vx, p) = (10,  0.5, 20)
#
#  EOS: ideal gas, Gamma = 5/3
#  CFL = 0.8, t_end = 0.4
#
#  Expected result:
#    - Left-going rarefaction wave
#    - Right-going rarefaction wave
#    - Contact discontinuity between the two rarefaction tails
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 100
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.8
  atmo_rho: 1.0e-10
  solver:   hllc
  device:   cpu

  primL:
    rho: 1.0
    p:   10.0
    vx:  -0.6
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  primR:
    rho: 10.0
    p:   20.0
    vx:  0.5
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  x_interface: 0.5

output:
  dir:           output_problem2
  every_n_steps: 1000