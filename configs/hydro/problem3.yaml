# ============================================================
#  1D SR hydro — Problem 3 (Mignone & Bodo 2005, §4.4)
#
#  Mildly relativistic blast wave. Left state has very high
#  pressure; right state has negligible pressure. The initial
#  discontinuity produces:
#    - A rarefaction wave moving left
#    - A shock wave + contact discontinuity moving right
#
#  Maximum Lorentz factor: gamma_max ~ 1.4
#
#  Initial data (eq. 34):
#    Left:  (rho, vx, p) = (10, 0, 40/3)
#    Right: (rho, vx, p) = (1,  0, ~0)        [p = (2/3)e-6]
#
#  EOS: ideal gas, Gamma = 5/3
#  CFL = 0.8, t_end = 0.4, 400 grid points recommended
#
#  Note: right-state pressure is set to a small but nonzero
#  value (2/3 * 1e-6) for numerical stability.
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.8
  atmo_rho: 1.0e-10
  solver:   hlld
  device:   cpu

  primL:
    rho: 10.0
    p:   13.3333333     # 40/3
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  primR:
    rho: 1.0
    p:   6.6666667e-7   # (2/3) * 1e-6
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  x_interface: 0.5

output:
  dir:           output_problem3
  every_n_steps: 1000