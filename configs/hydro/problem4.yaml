# ============================================================
#  1D SR hydro — Problem 4 (Mignone & Bodo 2005, §4.5)
#
#  Highly relativistic shock tube with an extreme pressure
#  ratio (10^5). This is a severe robustness test — many
#  solvers fail or produce non-physical states here.
#
#  Initial data (eq. 35):
#    Left:  (rho, vx, p) = (1, 0, 1e3)
#    Right: (rho, vx, p) = (1, 0, 1e-2)
#
#  EOS: ideal gas — gamma not specified in excerpt; Gamma=5/3
#  is a common choice for this test; adjust if your reference
#  uses a different value.
#
#  Expected result:
#    - Strongly relativistic blast: Lorentz factor >> 1
#    - Right-propagating shock + contact discontinuity
#    - Left-propagating rarefaction
#    - Solver positivity/floor limiters will be exercised
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666   # 5/3 — adjust if paper specifies otherwise
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.8
  atmo_rho: 1.0e-10
  solver:   hllc
  device:   cpu

  primL:
    rho: 1.0
    p:   1000.0
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  primR:
    rho: 1.0
    p:   0.01
    vx:  0.0
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  x_interface: 0.5

output:
  dir:           output_problem4
  every_n_steps: 1000