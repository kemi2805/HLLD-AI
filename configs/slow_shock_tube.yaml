# ============================================================
#  1D SR MHD -- Slow-shock tube.  GENERATED by scripts/make_slow_shock_tube.py
#
#  Gamma = 5/3.  Built backward from the wave curves so the exact solution
#  is known by construction: a weak left fast wave (P_tot x1.15), a 0.50 rad
#  rotational discontinuity, a slow SHOCK dropping |B_t| by 1.5x, and a
#  contact with density ratio 2.0.  The right family is silent.
#  Constructed-solution residual 1.7e-16; chi = 0.675 (non-coplanar).
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 400
  ng:     2

eos:
  K:        0.0
  gamma:    1.6666666
  gamma_th: 1.6666666

run:
  problem:  generic
  t_end:    0.4
  cfl:      0.4
  atmo_rho: 1.0e-10
  solver:   hlld
  device:   cpu

  primL:
    rho: 1
    p:   0.05
    vx:  0.1
    vy:  0
    vz:  0
    Bx:  1.5
    By:  0.75
    Bz:  0
  primR:
    rho: 7.72743135679
    p:   1.04847713597
    vx:  -0.486746278335
    vy:  -0.303374629434
    vz:  0.0644885444016
    Bx:  1.5
    By:  0.368942782495
    Bz:  0.337462921289
  x_interface: 0.5

output:
  dir:           output_slow_shock
  every_n_steps: 1000
