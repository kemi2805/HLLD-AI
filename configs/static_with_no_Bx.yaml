# ============================================================
#  1D SR-MHD — Uniform advection, zero B field
#
#  Tests that HLLD/HLLE preserves a uniform state exactly
#  when there is no magnetic field (pure SR hydro limit).
#
#  With Bx=0 on both sides, HLLD detects bn_zero=True and
#  falls back to HLLE automatically. This tests the HLLE
#  fallback path and the pure hydro flux computation.
#
#  Cold EOS (gamma_th=null): p_cold = K*rho^gamma = 1*1^(5/3) = 1.0
#  consistent with p=1.0.
#
#  Expected result: all fields constant to machine precision
#  (~1e-12) at t=1.0. By and Bz must stay exactly zero.
# ============================================================

grid:
  xmin:   0.0
  xmax:   1.0
  ncells: 40
  ng:     2

eos:
  K:        1.0
  gamma:    1.6666666
  gamma_th: null        # cold-only EOS: p = K * rho^gamma

run:
  problem:  generic
  t_end:    1.0
  cfl:      0.4
  atmo_rho: 1.0e-10
  solver:   hlld         # will auto-fall back to HLLE since Bx=0
  device:   cpu

  # Both sides identical — no wave should form.
  # vx=0.3 tests advection does not corrupt the state.
  # All B=0: HLLD bn_zero fallback to HLLE is triggered.
  primL:
    rho: 1.0
    p:   1.0
    vx:  0.3
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  primR:
    rho: 1.0
    p:   1.0
    vx:  0.3
    vy:  0.0
    vz:  0.0
    Bx:  0.0
    By:  0.0
    Bz:  0.0
  x_interface: 0.5

output:
  dir:           output_uniform_noB
  every_n_steps: 1000